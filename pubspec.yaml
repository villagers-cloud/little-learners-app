name: little_learners
description: Bilingual offline learning and play app for kids, with a parent-child co-play mode.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.5.5
  flutter_tts: ^4.2.5
  record: ^6.2.0
  audioplayers: ^6.6.0
  permission_handler: ^13.0.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
